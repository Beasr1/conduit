# Generates the HTTP layer from schema/openapi.yaml: types, plus a strict
# net/http server interface with one method per operation. Run `just gen`.
package: gen
output: internal/httpapi/gen/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  # Optional fields are plain values, not pointers, as in the workflow types.
  # omitzero leaves them out when unset, objects and times included, which
  # omitempty alone doesn't.
  prefer-skip-optional-pointer: true
  prefer-skip-optional-pointer-with-omitzero: true
  # Generate every schema, used or not: NodeEvent is the data of the event
  # stream, which the schema can only describe as text.
  skip-prune: true
  name-normalizer: ToCamelCaseWithInitialisms
# The definition is written in workflow.yaml and generated into the workflow
# package, so the API uses that same type instead of a copy.
import-mapping:
  ./workflow.yaml: github.com/Beasr1/conduit/server/internal/workflow
