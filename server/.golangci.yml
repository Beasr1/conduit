# golangci-lint v2. `just check` runs it and fails on any finding; `just fmt`
# applies the formatters.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - noctx
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Beasr1/conduit
