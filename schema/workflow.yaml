# The workflow definition: the document an editor saves and the engine runs.
# Go types in server/internal/workflow are generated from this file with
# `just gen`; generated code is never edited by hand. The engine's validation
# enforces the limits written here and reports every problem at once.
openapi: 3.1.0
info:
  title: Conduit workflow definition
  version: 0.1.0
paths: {}

components:
  schemas:
    Definition:
      description: A workflow. A node runs once its parents have finished, an http node if every edge into it was taken, and a transform node if every required one was and, with none required, any was. Otherwise it's skipped.
      type: object
      required: [nodes]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        output:
          type: string
          description: Kept for revisions saved with it, as response replaces it. JSONata over the finished run; such a definition answers 200 with its value. A definition has an output or a response, not both.
        response:
          $ref: "#/components/schemas/Response"
          description: What the workflow's API answers.
          x-go-type-skip-optional-pointer: false
        input_schema:
          type: object
          additionalProperties: true
          description: A JSON Schema (2020-12) that run input must match. A served workflow answers input that doesn't with 400. Its $refs can only point inside it.
        output_schema:
          type: object
          additionalProperties: true
          description: Kept for revisions saved with it, as response replaces it. A JSON Schema (2020-12) describing the output. Checked when saved, not enforced on runs yet.
        sample_input:
          description: A made-up run input, any JSON, that previews read. Runs ignore it. At most 64 KiB.
          x-go-type: json.RawMessage
        ui:
          $ref: "#/components/schemas/UI"
          description: How the editor draws the workflow. The engine ignores it.
          x-go-type-skip-optional-pointer: false

    UI:
      type: object
      additionalProperties: false
      properties:
        positions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Position"
          description: Where each node sits on the editor's canvas, keyed by node id. A node without one is laid out by the editor; a position for a node that isn't in the workflow is ignored.

    Position:
      type: object
      required: [x, y]
      additionalProperties: false
      description: A point on the canvas. A missing coordinate reads as 0.
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    Node:
      type: object
      required: [id, kind]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: Unique in the workflow. Expressions read the node's result as nodes.<id>.
        kind:
          $ref: "#/components/schemas/NodeKind"
        request:
          $ref: "#/components/schemas/HTTPRequest"
          description: The call an http node makes, unless it uses an upstream.
          x-go-type-skip-optional-pointer: false
        uses:
          $ref: "#/components/schemas/Uses"
          description: The upstream an http node calls, at a version, in place of a request of its own (plan 07). Its request, responses and samples are the version's, and the node has none of its own.
          x-go-type-skip-optional-pointer: false
        with:
          type: object
          additionalProperties:
            type: string
          description: For a node that uses an upstream, a JSONata expression over the run for each of the upstream's parameters, which its request reads.
        expr:
          type: string
          description: A transform node's JSONata. Its value becomes the node's body. A transform node has an expr or a switch.
        switch:
          $ref: "#/components/schemas/Switch"
          description: A transform node's cases, in place of an expr.
          x-go-type-skip-optional-pointer: false
        sample:
          $ref: "#/components/schemas/Sample"
          description: An http node's made-up or redacted 2xx response, which previews read in place of a real one. Runs ignore it.
          x-go-type-skip-optional-pointer: false
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/Output"
          description: An http node's answers besides 2xx, which is every http node's first output. A run takes a status listed here as the node's answer, and only the edges on its output can be taken; any other status outside 2xx fails the node, and its Unhandled block takes that as it takes every failure of the node's.
        unhandled:
          $ref: "#/components/schemas/NodeUnhandled"
          x-go-type-skip-optional-pointer: false

    Upstream:
      type: object
      required: [request]
      additionalProperties: false
      description: A saved API endpoint and how it's handled, one version of it (plan 07). Every save makes a new version, which never changes, and a step that uses the upstream pins one. Its templates and body read its parameters by name, {{ user_id }}, and each step that uses it gives them values.
      properties:
        parameters:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Parameter"
          description: What a step that uses it gives it, each a JSONata expression over the step's run. Its templates and body read them by name, and nothing else.
        request:
          $ref: "#/components/schemas/HTTPRequest"
          description: The call, as an http node's, its templates and body reading the parameters.
        sample:
          $ref: "#/components/schemas/Sample"
          description: Its made-up or redacted 2xx response, which previews of a step that uses it read.
          x-go-type-skip-optional-pointer: false
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/Output"
          description: Its answers besides 2xx, as an http node's. A step that uses it has a block for each, and lines from them.

    Uses:
      type: object
      required: [upstream, version]
      additionalProperties: false
      description: An upstream, pinned to a version, which never changes (plan 07).
      properties:
        upstream:
          type: string
          description: The upstream's id.
        version:
          type: integer
          minimum: 1

    Parameter:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: Unique in its upstream. Its templates read it as {{ name }}, and its body as name.
        sample:
          description: A made-up value, any JSON, which the library's preview of the upstream gives the parameter; a step gives it its own. At most 64 KiB.
          x-go-type: json.RawMessage

    NodeKind:
      type: string
      enum: [http, transform]
      description: An http node calls an upstream, once every edge into it was taken. A transform node gives what its JSONata does, once every required edge into it was and, with none required, any was, reading whichever nodes came; one with no edge into it runs first.

    Output:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 300
          maximum: 599
          description: Listed once in a node.
        sample:
          $ref: "#/components/schemas/Sample"
          description: A made-up or redacted response with this status, which previews read. It has no status of its own.
          x-go-type-skip-optional-pointer: false

    Sample:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 200
          maximum: 299
          description: Absent means 200. Only a node's 2xx sample has one; an output's sample takes the output's.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Header names are read in lower case, as a run reads a response's.
        body:
          description: The response body, any JSON. At most 64 KiB.
          x-go-type: json.RawMessage

    HTTPRequest:
      type: object
      required: [method, url]
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE]
        url:
          type: string
          description: An absolute http or https URL. {{ jsonata }} placeholders may appear in its path and query only.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Header values are templates, text with {{ jsonata }} placeholders.
        query:
          type: object
          additionalProperties:
            type: string
          description: Query parameters added to the URL. Values are templates.
        body:
          type: string
          description: JSONata whose value is sent as the JSON request body.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 300000
          description: Timeout for each attempt, in milliseconds. Default 30000.
        retry:
          $ref: "#/components/schemas/Retry"
          x-go-type-skip-optional-pointer: false

    Retry:
      description: Retries transport errors, timeouts, 429 and 5xx responses, with backoff and Retry-After honoured.
      type: object
      required: [attempts]
      additionalProperties: false
      properties:
        attempts:
          type: integer
          minimum: 2
          maximum: 5
          description: Total attempts, the first included.
        idempotent:
          type: boolean
          description: The upstream treats repeats of this request as one, so a POST or PATCH may be retried too. They're then sent with an Idempotency-Key header.

    Response:
      type: object
      additionalProperties: false
      description: What the workflow's API answers. Each answer is a status and the lines into it, each from a block of a node that gives it. A run answers with the first answer, top to bottom, that one of its lines reached (plan 14). A run that reaches none, or in which a node fails the run, gives no answer, and fails; then Conduit answers it, by cause, with the error body. Publishing needs every way a run can go to reach an answer (plan 12).
      properties:
        answers:
          type: array
          maxItems: 50
          description: The answers the API can give, in the order a run tries them, each a status, the lines into it, and the shape promised with it.
          items:
            $ref: "#/components/schemas/Answer"
        errors:
          $ref: "#/components/schemas/Errors"
          x-go-type-skip-optional-pointer: false

    Answer:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 200
          maximum: 599
          description: The HTTP status the answer has. Listed once in a response.
        lines:
          type: array
          description: The lines into the answer, each from a block of a node. A run gives the answer when it reached one of them and no answer listed above it; its first line reached, in this order, gives the body.
          items:
            $ref: "#/components/schemas/AnswerLine"
        schema:
          type: object
          additionalProperties: true
          description: A JSON Schema (2020-12) the body is promised to match. Checked when saved, not enforced on runs yet.

    AnswerLine:
      type: object
      required: [from]
      additionalProperties: false
      description: A line into an answer, from one block of a node. A run reaches it when its node answered through that block, or failed into its Unhandled. A block is joined to one answer, but for a transform with an expr, which picks among several.
      properties:
        from:
          type: string
          description: The node the line leaves from. A block joined to one answer gives its node's result as the body; a transform with an expr joined to several from its value picks among them, its result {status, body}, the status one of theirs. A transform's case is joined to the answer of its own status.
        on:
          type: integer
          description: The output of from that the line leaves from, as an edge's. Absent means an http node's 2xx, the only output of a transform with an expr, or the Unhandled block when unhandled is set.
        unhandled:
          type: boolean
          description: The line leaves from from's Unhandled block, as an edge can, and on is absent. The answer's body is then what from's Unhandled body gave, or, with none, the response's error body over from's failure.

    Errors:
      type: object
      required: [body]
      additionalProperties: false
      description: The body of every error the workflow answers without one of its own. A run that gives no answer gets it, at its cause's status, 502 when an upstream failed, 504 when the run or a node ran out of time, 500 otherwise. So does an answer whose line leaves an http node's block for a status of 400 or more, and one joined to a node's Unhandled with no body of its own, each at the answer's status. With none, each is answered with Conduit's problem details.
      properties:
        body:
          type: string
          description: JSONata over the run as it stood, every node that succeeded, and error, {code, detail, node}, beside the upstream's status, headers and body when it answered.

    NodeUnhandled:
      type: object
      additionalProperties: false
      description: What a node does with its failures. Its Unhandled block takes them when a line or an answer leaves from it, and gives its body, or, without one, what an http node got back, if anything. With no line from it, they fail the run, and publishing needs that chosen, with fail (plan 12).
      properties:
        fail:
          type: boolean
          description: The node's failures fail the run, on purpose, and the response answers by cause with its error body. Not with a line or an answer from the node's Unhandled block, which takes them instead.
        body:
          type: string
          description: JSONata over what the node read and its own failure, nodes.<id>.error, {code, detail}, beside an http node's status, headers and body when it got an answer. Its value is what the nodes after read as nodes.<id>.body, error, status and headers staying as they are, and the body of an answer joined straight to the block. One that fails fails the run.

    Switch:
      type: object
      required: [cases]
      additionalProperties: false
      description: A transform node's cases, in place of an expr. The first case whose condition holds gives its status and body, as an http node's answer would, so the nodes after read them as nodes.<id>.status and nodes.<id>.body. Each case is an exit of the node, named by its status, so a switch gives a status once, and a run takes the lines from the exit it took. When none holds, the node fails, and its Unhandled block takes that as it takes any failure.
      properties:
        cases:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Case"

    Case:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        name:
          type: string
          description: What the editor calls the case, on its exit and its tab. Absent, it's Case and its place.
        when:
          type: string
          description: JSONata, cast to a boolean as an edge's condition is.
        status:
          type: integer
          minimum: 200
          maximum: 599
        body:
          type: string
          description: JSONata whose value is the body. Absent means none.

    Edge:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
        on:
          type: integer
          description: The output of its source the edge leaves from, by status, one an http node lists or one a transform's case gives. Absent means an http node's 2xx, the only output of a transform with an expr, or the Unhandled block when unhandled is set.
        unhandled:
          type: boolean
          description: The edge leaves from its source's Unhandled block, and on is absent. Every node has one. It takes what the node's other outputs don't, a failure of its own, a status it doesn't list among them, so a run goes on down the edges from it, its node failed; with no line from it, the failure fails the run. Steps after it read the failure as nodes.<id>.error, {code, detail}, beside an http node's status, headers and body when it got an answer.
        when:
          type: string
          description: A JSONata condition, cast to a boolean the way $boolean() does. The edge is taken when its source answered through the edge's output, or failed into its Unhandled block, and this is true. Absent means true.
        required:
          type: boolean
          description: Into a transform node, the edge has to be taken for the node to run, as every edge into an http node has; without it, the transform is skipped. Absent, an edge into a transform may not be taken, its node then missing from what the transform reads.
