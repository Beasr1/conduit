# The API contract. Server and web code are generated from this file with
# `just gen`; generated code is never edited by hand. The workflow
# definition itself lives in workflow.yaml.
openapi: 3.1.0
info:
  title: Conduit API
  version: 0.1.0

# Every operation needs the bearer token, or the web app's session cookie,
# unless it says otherwise.
security:
  - bearer: []
  - session: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Report that the process is up
      description: Checks no dependencies, so a slow dependency can't make the process look dead.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadyz
      summary: Report that the server can reach its database
      security: []
      responses:
        "200":
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/session:
    post:
      operationId: createSession
      summary: Sign a browser in
      description: Trades the API token for the session cookie the web app uses. Scripts and agents send the token as a bearer token instead, and a served workflow's callers, one of its caller keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "204":
          description: Signed in, until 30 minutes pass without a request, or 12 hours after sign-in, whichever comes first.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Sign a browser out
      description: Ends the session the cookie names, on the server as well, so a copy of the cookie stops working, and clears the cookie. It needs no live session, so signing out always works.
      security: []
      parameters:
        - name: __Host-conduit_session
          in: cookie
          description: The session to end. Without one, or with one this server didn't set, the cookie is only cleared.
          schema:
            type: string
          x-go-name: Session
      responses:
        "204":
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie:
              schema:
                type: string

  /v1/workflows:
    get:
      operationId: listWorkflows
      summary: List workflows, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return workflows older than this id, for the next page.
          schema:
            type: string
      responses:
        "200":
          description: A page of workflows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorkflow
      summary: Create a workflow; its definition becomes revision 1
      description: The definition is saved even if it has problems; they're listed in the response. Publishing needs a revision without any.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflow"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRevision"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: getWorkflow
      summary: Get a workflow and its latest revision
      responses:
        "200":
          description: The workflow. Send its ETag as If-Match when saving the next revision.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRevision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    put:
      operationId: saveDraft
      summary: Save the next revision
      description: If-Match must name the latest revision, so a save can't silently undo someone else's. The definition is saved even if it has problems. A definition that's the latest revision's, by value, makes no revision; the answer is that revision, as it was.
      parameters:
        - name: If-Match
          in: header
          description: The latest revision's ETag, such as "3". Without it the save is refused with 428.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workflow.yaml#/components/schemas/Definition"
      responses:
        "200":
          description: Saved.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: listRevisions
      summary: List a workflow's revisions, newest first
      responses:
        "200":
          description: Every revision, without definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/revisions/{revision}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getRevision
      summary: Get one revision, with its problems
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: publishWorkflow
      summary: Make a revision the one served
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Publish"
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/validate:
    post:
      operationId: validateDefinition
      summary: Check a definition without saving it
      description: Problems in the definition are the answer, not an error, so they come back with 200. A body that isn't a definition at all, with a field one doesn't have or a value of the wrong type, is refused with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workflow.yaml#/components/schemas/Definition"
      responses:
        "200":
          description: What's wrong with the definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/preview:
    post:
      operationId: previewDefinition
      summary: Preview what a step would read and send, or whether a connection is taken, over the samples
      description: Simulates a run up to the step and calls nothing. Each http step before it answers with the sample of the output that leads to the step, each transform before it is evaluated, and so is each connection's condition; then the step renders its request, or gives its value. A connection is previewed up to its source, which answers through the connection's output, and then its condition. Works on a definition with problems, and returns the ones in the way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: startRun
      summary: Run a revision in the background
      description: The run goes on after this answers, for up to 5 minutes. Follow it at /v1/runs/{id}/events, or fetch it. A call carrying W3C trace context (traceparent, tracestate) continues its trace, and one that has already passed through Conduit 8 times is refused with 508 (plan 06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRun"
      responses:
        "202":
          description: Started.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Busy"
        "508":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: listKeys
      summary: List a workflow's caller keys, newest first
      description: Every key the workflow has had, never with its value (plan 07). Rotated, expired and revoked keys stay listed, for audit.
      responses:
        "200":
          description: Its keys, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallerKeyList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createKey
      summary: Make a caller key
      description: The answer holds the key, the only time it's sent; the server keeps its SHA-256 and its first characters. /serve/{slug} takes it as a bearer token. Each of a workflow's active keys has a name of its own, so a name one has already is 409 conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKey"
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MadeKey"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/keys/{key}/rotate:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
      - $ref: "#/components/parameters/KeyID"
    post:
      operationId: rotateKey
      summary: Give an active key's caller a new key, and the old one an expiry
      description: The new key has the old one's name, and the answer holds it, the only time it's sent. The old key goes on working until the expiry chosen, so its caller can change over, or stops at once. A key rotated or revoked already is 409 key_not_active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateKey"
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedKey"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/keys/{key}/revoke:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
      - $ref: "#/components/parameters/KeyID"
    post:
      operationId: revokeKey
      summary: Stop a key at once
      description: A revoked key stays listed, for audit. Revoking a key revoked already, or past its expiry, changes nothing.
      responses:
        "200":
          description: Revoked, or as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallerKey"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/upstreams:
    get:
      operationId: listUpstreams
      summary: List the upstream library, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return upstreams older than this id, for the next page.
          schema:
            type: string
      responses:
        "200":
          description: A page of upstreams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUpstream
      summary: Make an upstream; its definition becomes version 1
      description: A saved API endpoint and how it's handled (plan 07). A step that uses it pins a version, so a definition with problems isn't saved; they're listed in the 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpstream"
      responses:
        "201":
          description: Made.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamVersion"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/upstreams/validate:
    post:
      operationId: validateUpstream
      summary: Check an upstream's definition without saving it
      description: What a save would refuse it for, as the library's page checks while it's edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workflow.yaml#/components/schemas/Upstream"
      responses:
        "200":
          description: Its problems, none when it can be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/upstreams/{id}:
    parameters:
      - $ref: "#/components/parameters/UpstreamID"
    get:
      operationId: getUpstream
      summary: Get an upstream at its latest version
      responses:
        "200":
          description: The upstream. Send its ETag as If-Match when saving the next version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamVersion"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: saveUpstream
      summary: Save the next version
      description: If-Match must name the latest version, so a save can't silently undo someone else's. Versions never change, so a definition with problems isn't saved; they're listed in the 422. A definition that's the latest version's, by value, makes no version; the answer is that version, as it was.
      parameters:
        - name: If-Match
          in: header
          description: The latest version's ETag, such as "3". Without it the save is refused with 428.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workflow.yaml#/components/schemas/Upstream"
      responses:
        "200":
          description: Saved.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamVersion"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUpstream
      summary: Delete an upstream no revision pins
      description: Deletes the upstream and every version of it. While a saved revision of any workflow, published or not, pins one of its versions, it's refused with 409, code upstream_in_use, its detail naming those workflows and revisions, as a revision never changes and must keep running (plan 07).
      responses:
        "204":
          description: Deleted, with every version.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/upstreams/{id}/users:
    parameters:
      - $ref: "#/components/parameters/UpstreamID"
    get:
      operationId: listUpstreamUsers
      summary: List the workflows whose latest revision uses an upstream, and the versions each pins
      responses:
        "200":
          description: The workflows, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUsers"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/upstreams/{id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/UpstreamID"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getUpstreamVersion
      summary: Get one version of an upstream
      responses:
        "200":
          description: The version, which never changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamVersion"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/constants:
    get:
      operationId: listConstants
      summary: List the constants, by name
      description: Values every expression reads as $const.name (plan 06). A secret one's value is never sent.
      responses:
        "200":
          description: Every constant, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstantList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConstant
      summary: Make a constant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConstant"
      responses:
        "201":
          description: Made.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constant"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/constants/{name}:
    parameters:
      - $ref: "#/components/parameters/ConstantName"
    put:
      operationId: setConstant
      summary: Change a constant's value, keeping the one before
      description: Every run from then on reads the new value, with no Publish. secret true makes a plain constant secret, for good, as there's no showing it again. A value equal to the one it has changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetConstant"
      responses:
        "200":
          description: Changed, or as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constant"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteConstant
      summary: Delete a constant nothing reads
      description: Refused with 409 constant_in_use while a saved revision of a workflow, or a version of an upstream, reads it, as either can run again.
      responses:
        "204":
          description: Deleted, with its previous value.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/constants/{name}/undo:
    parameters:
      - $ref: "#/components/parameters/ConstantName"
    post:
      operationId: undoConstant
      summary: Put a constant's previous value back
      description: The value it replaces becomes the previous one, so undoing again puts it back. Refused with 409 nothing_to_undo when it has no previous value.
      responses:
        "200":
          description: Its previous value, back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constant"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/constants/{name}/users:
    parameters:
      - $ref: "#/components/parameters/ConstantName"
    get:
      operationId: listConstantUsers
      summary: List the workflows and upstreams whose latest revision or version reads a constant
      responses:
        "200":
          description: The workflows and upstreams, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstantUsers"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/runs:
    get:
      operationId: listRuns
      summary: List runs, newest first
      parameters:
        - name: workflow_id
          in: query
          description: Only this workflow's runs.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return runs older than this id, for the next page.
          schema:
            type: string
      responses:
        "200":
          description: A page of runs, without their input, output or nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRun
      summary: Get a run, with what each node did
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: streamRunEvents
      summary: Follow a run as it happens
      description: |
        Server-sent events. Each node's progress is an event named `node`, with a NodeEvent as its data and its number in the run as its `id`. The run's end is an event named `run`, with the Run as its data and the id `end`, and the stream closes after it.

        A client that connects late, or reconnects with Last-Event-ID, gets the node events after that id, then the rest as they happen. They're kept until a minute after the run ends; after that, it gets only the `run` event. A reconnect with Last-Event-ID `end` gets 204, so an EventSource stops reconnecting. A comment line arrives every 15 s while nothing else does.
      parameters:
        - name: Last-Event-ID
          in: header
          description: The id of the last event received, a node event's number or `end`. The stream resumes after it.
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "204":
          description: The client already has the run's last event, so there's nothing more to send.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Busy"

  /serve/{slug}:
    post:
      operationId: serveWorkflow
      summary: Run a workflow's published revision and answer with the answer it gives
      description: The body is the run's input. A call is made with one of the workflow's caller keys as its bearer token (plan 07), and the run records it; the API token and the session cookie are refused. A key of another workflow, one revoked or past its expiry, and a slug with no workflow are all 401, alike, so the answer doesn't say which keys or workflows there are; as RFC 6750 asks, a refused bearer token is told error="invalid_token" in WWW-Authenticate, and a call without one isn't. A run answers with the answer it gave, its status and its body. A run that gives none, as a node failed, or it took no line into the response, or lines from two nodes, answers with its response's default, if it has one, at the status of the cause, 502 an upstream failed, 504 a timeout, 500 otherwise. Without one, or with no response, it answers that status with problem details naming what failed; `instance` is the run, at /v1/runs/{id}. A revision saved with an output answers 200 with it. Served runs time out after 30 s. A call carrying W3C trace context (traceparent, tracestate) continues its trace, and the run's own calls pass it on, one hop further; a call that has already passed through Conduit 8 times, a workflow calling itself, is refused with 508 before a run starts (plan 06).
      security:
        - callerKey: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              description: The run's input. Absent means null.
              x-go-type: json.RawMessage
      responses:
        "200":
          description: The run's answer, when its status is 200. An answer with another status comes the same way, with that status.
          content:
            application/json:
              schema:
                x-go-type: json.RawMessage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Busy"
        "504":
          $ref: "#/components/responses/Problem"
        "508":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The server's one API token (CONDUIT_API_TOKEN).
    callerKey:
      type: http
      scheme: bearer
      description: One of a workflow's caller keys, cnd_ and 43 letters and digits (plan 07). Only /serve/{slug} takes one, and only one of that workflow's.
    session:
      type: apiKey
      in: cookie
      name: __Host-conduit_session
      description: The web app's session, set by POST /v1/session. It ends after 30 minutes without a request, 12 hours after sign-in, or at sign-out. A write made with it must come from the app's own pages (Sec-Fetch-Site same-origin), or it's refused with 403.

  parameters:
    WorkflowID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UpstreamID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ConstantName:
      name: name
      in: path
      required: true
      schema:
        type: string
    KeyID:
      name: key
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: id
      in: path
      required: true
      schema:
        type: string

  headers:
    ETag:
      description: The revision, quoted, such as "3".
      schema:
        type: string

  responses:
    Problem:
      description: RFC 9457 problem details. `code` says what went wrong; `errors` lists every problem with a JSON Pointer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: Too many runs are in progress, on the server or of the one workflow, which may have a quarter of the server's at once, or the server is shutting down. Try again after Retry-After seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Workflow:
      type: object
      required: [id, slug, name, latest_revision, created_at]
      properties:
        id:
          type: string
        slug:
          type: string
          description: Lowercase letters, digits and hyphens. The served endpoint is /serve/{slug}.
        name:
          type: string
        latest_revision:
          type: integer
        published_revision:
          type: integer
          description: Absent until a revision is published.
        created_at:
          type: string
          format: date-time

    WorkflowList:
      type: object
      required: [workflows]
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        next:
          type: string
          description: Pass as `before` for the next page. Absent on the last page.

    SignIn:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The API token.

    CreateWorkflow:
      type: object
      required: [slug, name, definition]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          $ref: "./workflow.yaml#/components/schemas/Definition"

    Publish:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1

    Provenance:
      type: object
      required: [actor]
      properties:
        actor:
          type: string
          description: Who saved it. In v1 always "token".
        client:
          type: string
          description: What it was saved with, from the User-Agent header.

    Revision:
      type: object
      required: [workflow_id, revision, definition, problems, provenance, created_at]
      properties:
        workflow_id:
          type: string
        revision:
          type: integer
        definition:
          $ref: "./workflow.yaml#/components/schemas/Definition"
        problems:
          type: array
          description: Everything wrong with the definition. Empty when it can be published.
          items:
            $ref: "#/components/schemas/ProblemError"
        provenance:
          $ref: "#/components/schemas/Provenance"
        created_at:
          type: string
          format: date-time

    PreviewRequest:
      type: object
      required: [definition]
      additionalProperties: false
      properties:
        definition:
          $ref: "./workflow.yaml#/components/schemas/Definition"
        node:
          type: string
          description: The step to preview, by id. Absent, with no edge, means the workflow's output.
        edge:
          type: integer
          minimum: 0
          description: The connection to preview, by its place in the definition's edges. Not with node.
          x-go-type-skip-optional-pointer: false
        upstreams:
          type: object
          additionalProperties:
            $ref: "./workflow.yaml#/components/schemas/Upstream"
          description: Unsaved versions of the upstreams steps use, by the step's id, which the preview uses in place of the version each pins, to show what an upstream being edited would do (plan 07).

    Preview:
      type: object
      required: [reads, skipped, problems]
      properties:
        reads:
          description: The data document the step, or a connection's condition, reads, {"input", "nodes"}, as a run would build it from the samples. For a transform with ways, what the run by each reads, merged, a node read differently by two as the first read it.
          x-go-type: json.RawMessage
        ways:
          type: array
          description: A transform with two or more edges into it, a result for a run by each, in the definition's order. Each run comes by the transform's required edges first, and by its own where they let it; the steps before answer through the outputs that lead there.
          items:
            $ref: "#/components/schemas/WayPreview"
        outcomes:
          type: object
          description: For a step, or a connection's source, what each step before it may have done in a run that reaches it, by id, worked out from the edges whatever the samples. Absent when it never runs, or the edges have a cycle.
          additionalProperties:
            $ref: "#/components/schemas/StepOutcome"
        taken:
          type: boolean
          description: A connection's preview only, whether a run would take it with these samples.
          x-go-type-skip-optional-pointer: false
        sends:
          $ref: "#/components/schemas/RenderedRequest"
        parameters:
          description: An http step that uses an upstream, the values its parameters take, by name, which its request reads; one that uses a workflow, the input it gives it, by field. One whose value fails is left out, as the problems say.
          x-go-type: json.RawMessage
        gives:
          description: A transform step's value, the workflow's output, or, for an http step that uses a workflow, the answer it gets back, {"status", "body"}, from the workflow's own preview. Absent when it gave none, and for a transform with ways, as each way gives its own.
          x-go-type: json.RawMessage
        unhandled:
          $ref: "#/components/schemas/UnhandledPreview"
        skipped:
          type: boolean
          description: A run would skip the step, or a connection's source, with these samples, as a connection into an http step isn't taken, or none into a transform is.
        problems:
          type: array
          description: What kept a part from rendering, each sample missing on the way, and what's wrong with the definition there.
          items:
            $ref: "#/components/schemas/ProblemError"

    StepOutcome:
      type: object
      description: What a step may have done in a run that reaches a step after it.
      required: [outputs, conditional]
      properties:
        outputs:
          type: array
          items:
            type: integer
          description: The outputs it may have answered through, sorted. -1 is its Unhandled, 0 is 2xx and a transform's one value, and any other is a status, a case's among them.
        conditional:
          type: boolean
          description: A run may reach the step after it without it, having skipped it.

    WayPreview:
      type: object
      description: What a transform gives in a run that comes by one edge into it, over the samples.
      required: [edge, skipped]
      properties:
        edge:
          type: integer
          description: The edge, by its place in the definition's edges.
        gives:
          description: The transform's value in that run. Absent when it gave none.
          x-go-type: json.RawMessage
        skipped:
          type: boolean
          description: No run comes by the edge, as that run doesn't take it, or skips the transform when a required edge isn't taken.

    UnhandledPreview:
      type: object
      description: A step with an Unhandled body, failing into the block with an error made up, as a preview calls nothing.
      required: [reads]
      properties:
        reads:
          description: What the body reads, the step's own made-up failure among it.
          x-go-type: json.RawMessage
        gives:
          description: What the body gives. Absent when it gave nothing, or failed, as the preview's problems then say.
          x-go-type: json.RawMessage

    RenderedRequest:
      type: object
      description: An http step's request, as a run would send it. A part that didn't render is left out, and its problem says why.
      required: [method, headers]
      properties:
        method:
          type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          description: The JSON body.
          x-go-type: json.RawMessage

    Validation:
      type: object
      required: [problems]
      properties:
        problems:
          type: array
          description: Everything wrong with the definition. Empty when it can be published.
          items:
            $ref: "#/components/schemas/ProblemError"

    RevisionSummary:
      type: object
      required: [revision, provenance, created_at]
      properties:
        revision:
          type: integer
        provenance:
          $ref: "#/components/schemas/Provenance"
        created_at:
          type: string
          format: date-time

    RevisionList:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/RevisionSummary"

    UpstreamSummary:
      type: object
      required: [id, name, latest_version, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique in the library.
        latest_version:
          type: integer
        created_at:
          type: string
          format: date-time

    UpstreamList:
      type: object
      required: [upstreams]
      properties:
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamSummary"
        next:
          type: string
          description: Pass as `before` for the next page. Absent on the last page.

    CreateUpstream:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          $ref: "./workflow.yaml#/components/schemas/Upstream"

    UpstreamUsers:
      type: object
      required: [workflows]
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamUse"

    UpstreamUse:
      type: object
      required: [workflow_id, name, revision, versions, published]
      properties:
        workflow_id:
          type: string
        name:
          type: string
        revision:
          type: integer
          description: The workflow's latest revision, which uses the upstream.
        versions:
          type: array
          items:
            type: integer
          description: The versions its steps pin, oldest first.
        published:
          type: boolean
          description: Whether that revision is the one the workflow serves.

    UpstreamVersion:
      type: object
      required: [upstream, version, definition, provenance, created_at]
      properties:
        upstream:
          $ref: "#/components/schemas/UpstreamSummary"
        version:
          type: integer
        definition:
          $ref: "./workflow.yaml#/components/schemas/Upstream"
        provenance:
          $ref: "#/components/schemas/Provenance"
        created_at:
          type: string
          format: date-time

    Constant:
      type: object
      required: [name, secret, has_previous, provenance, updated_at, created_at]
      properties:
        name:
          type: string
          description: How expressions read it, $const.name.
        secret:
          type: boolean
          description: Its value is never sent back, and runs mask it wherever they're kept or shown.
        value:
          type: string
          description: A plain constant's value. Absent for a secret one.
        has_previous:
          type: boolean
          description: Whether undo has a value to put back.
        provenance:
          $ref: "#/components/schemas/Provenance"
        updated_at:
          type: string
          format: date-time
          description: When its value was last set.
        created_at:
          type: string
          format: date-time

    ConstantList:
      type: object
      required: [constants]
      properties:
        constants:
          type: array
          items:
            $ref: "#/components/schemas/Constant"

    CreateConstant:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name:
          type: string
          description: A lower-case letter, then up to 63 lower-case letters, digits and underscores.
        value:
          type: string
          description: 1 to 4096 characters.
        secret:
          type: boolean
          default: false

    SetConstant:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          description: 1 to 4096 characters.
        secret:
          type: boolean
          description: True makes a plain constant secret, for good. False or absent leaves it as it is.

    ConstantUsers:
      type: object
      required: [workflows, upstreams]
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/ConstantWorkflowUse"
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/ConstantUpstreamUse"

    ConstantWorkflowUse:
      type: object
      required: [workflow_id, name, revision]
      properties:
        workflow_id:
          type: string
        name:
          type: string
        revision:
          type: integer
          description: The workflow's latest revision, which reads the constant.

    ConstantUpstreamUse:
      type: object
      required: [upstream_id, name, version]
      properties:
        upstream_id:
          type: string
        name:
          type: string
        version:
          type: integer
          description: The upstream's latest version, which reads the constant.

    CallerKey:
      type: object
      required: [id, name, prefix, status, provenance, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          description: Who calls with it, such as CRM sync. A rotated key's new key has its name.
        prefix:
          type: string
          description: The key's first 8 characters, cnd_ and 4 more, to tell it apart. The server keeps no more of it than these and its SHA-256.
        status:
          type: string
          enum: [active, expiring, expired, revoked]
          description: active, it works and can be rotated; expiring, rotated, and it works until expires_at; expired, rotated, and past expires_at; revoked, stopped at revoked_at. Active and expiring keys work.
        expires_at:
          type: string
          format: date-time
          description: When a rotated key stops working, as chosen when it was rotated. Absent for a key not rotated.
        revoked_at:
          type: string
          format: date-time
          description: When it was revoked. Absent for a key not revoked.
        last_used_at:
          type: string
          format: date-time
          description: When its latest run started. Absent for a key no run has used.
        provenance:
          $ref: "#/components/schemas/Provenance"
        created_at:
          type: string
          format: date-time

    CallerKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/CallerKey"

    CreateKey:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Who calls with it, 1 to 200 characters.

    MadeKey:
      type: object
      required: [key, value]
      properties:
        key:
          $ref: "#/components/schemas/CallerKey"
        value:
          type: string
          description: The key itself, cnd_ and 43 letters and digits. It's never sent again.

    RotateKey:
      type: object
      required: [old_expires_in]
      additionalProperties: false
      properties:
        old_expires_in:
          type: string
          enum: [now, 1h, 1d, 7d]
          description: How long the old key goes on working, so its caller can change over to the new one; now stops it at once.

    RotatedKey:
      type: object
      required: [key, value, old]
      properties:
        key:
          $ref: "#/components/schemas/CallerKey"
          description: The new key.
        value:
          type: string
          description: The new key itself, cnd_ and 43 letters and digits. It's never sent again.
        old:
          $ref: "#/components/schemas/CallerKey"
          description: The old key, with its expiry.

    WorkflowRevision:
      type: object
      required: [workflow, revision]
      properties:
        workflow:
          $ref: "#/components/schemas/Workflow"
        revision:
          $ref: "#/components/schemas/Revision"

    # RFC 9457 problem details: the shape of every error response.
    Problem:
      type: object
      properties:
        type:
          type: string
          description: A URI identifying the kind of problem.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Our stable error code.
        node:
          type: string
          description: The node that failed a served run.
        errors:
          type: array
          description: Every validation problem at once.
          items:
            $ref: "#/components/schemas/ProblemError"

    ProblemError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901, plain form) into the submitted document.
        code:
          type: string
        detail:
          type: string

    StartRun:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision to run. Absent means the latest.
        input:
          description: The run's input, checked against the definition's input_schema. Absent means null.
          x-go-type: json.RawMessage

    RunParent:
      type: object
      required: [run, node]
      description: The run, and the step in it, a run of a workflow a step uses was called from (plan 07).
      properties:
        run:
          type: string
        node:
          type: string

    RunSummary:
      type: object
      required: [id, workflow_id, revision, trigger, status, started_at]
      properties:
        id:
          type: string
        workflow_id:
          type: string
        revision:
          type: integer
        trigger:
          type: string
          enum: [editor, served, workflow]
          description: editor, from POST /v1/workflows/{id}/runs; served, from POST /serve/{slug}; workflow, from a step of another run that uses the workflow (plan 07), which parent names.
        parent:
          $ref: "#/components/schemas/RunParent"
          description: A run of a workflow a step uses, the run and the step it was called from. Absent for any other run.
          x-go-type-skip-optional-pointer: false
        trace_id:
          type: string
          description: The W3C trace the run belongs to, 32 lowercase hex digits; the caller's, when the call that started it carried one. Runs that call each other through /serve share it. Absent for runs from before traces were kept.
        key:
          $ref: "#/components/schemas/RunKey"
          description: The caller key a served run was called with (plan 07). Absent for any other run, and for served runs from before keys.
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        error:
          $ref: "#/components/schemas/RunError"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the run goes on.
        answered:
          type: integer
          description: The status of the answer the run gave, its own once it succeeded, or, once it failed, the status by cause its response's error body answered with, if it has one; a served run answered its caller with it. Absent while it goes on, and when it gave none.

    RunKey:
      type: object
      required: [id, name, prefix]
      properties:
        id:
          type: string
        name:
          type: string
          description: Who calls with it.
        prefix:
          type: string
          description: Its first characters, which tell a rotated key and its new key apart.

    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required: [input]
          properties:
            input:
              description: The input, as sent.
              x-go-type: json.RawMessage
            output:
              description: The body of the answer the run gave, unless it has none. Over 256 KiB, its first 256 KiB as a string, and output_truncated is true.
              x-go-type: json.RawMessage
            output_truncated:
              type: boolean
            nodes:
              type: array
              description: What each node did, in the order they ended. Only from GET /v1/runs/{id}.
              items:
                $ref: "#/components/schemas/NodeRun"

    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next:
          type: string
          description: Pass as `before` for the next page. Absent on the last page.

    RunError:
      type: object
      description: Why a run or a node didn't succeed.
      required: [code, detail]
      properties:
        code:
          type: string
          enum: [upstream_failed, timeout, workflow_error, internal_error, cancelled, interrupted]
          description: |
            upstream_failed: an upstream answered with an error status, or couldn't be reached, read or allowed.
            timeout: the run, or a node's last attempt, ran out of time.
            workflow_error: the workflow's own configuration failed, such as an expression.
            internal_error: our bug; the details are in the server's log.
            cancelled: the caller hung up, or the server shut down.
            interrupted: the server stopped before the run ended.
        detail:
          type: string
        node:
          type: string
          description: On a run's error, the node that failed it.
        caught:
          type: boolean
          description: On a node's error, its Unhandled block took it, and the run went on down the lines from that block.

    NodeRun:
      type: object
      required: [node, status, attempts, ended_at]
      properties:
        node:
          type: string
        status:
          type: string
          enum: [succeeded, failed, skipped, cancelled]
        attempts:
          type: integer
          description: Requests an http node sent. 0 for a node that sent none.
        request:
          $ref: "#/components/schemas/NodeRequest"
        response:
          $ref: "#/components/schemas/NodeResponse"
        error:
          $ref: "#/components/schemas/RunError"
        took:
          type: array
          description: The lines the node's answer took, of those leaving the output it answered through, the ones whose condition held, in the definition's order. Absent for a node that took none.
          items:
            $ref: "#/components/schemas/Line"
        started_at:
          type: string
          format: date-time
          description: Absent if the node never started.
        ended_at:
          type: string
          format: date-time

    NodeRequest:
      type: object
      description: What an http node sent. Secrets aren't kept. The values of the Authorization, Proxy-Authorization, Cookie and Set-Cookie headers are [redacted], as are those of any header or query parameter whose name contains key, token, secret or password, and a password in the URL.
      required: [method, url, headers]
      properties:
        method:
          type: string
        url:
          type: string
        headers:
          type: object
          description: Lower-case names; repeated headers joined by commas.
          additionalProperties:
            type: string
