# The API contract. Server and web code are generated from this file with
# `just gen`; generated code is never edited by hand. The workflow
# definition itself lives in workflow.yaml.
openapi: 3.1.0
info:
  title: Conduit API
  version: 0.1.0

# Every operation needs the bearer token unless it says otherwise.
security:
  - bearer: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Report that the process is up
      description: Checks no dependencies, so a slow dependency can't make the process look dead.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadyz
      summary: Report that the server can reach its database
      security: []
      responses:
        "200":
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/workflows:
    get:
      operationId: listWorkflows
      summary: List workflows, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return workflows older than this id, for the next page.
          schema:
            type: string
      responses:
        "200":
          description: A page of workflows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorkflow
      summary: Create a workflow; its definition becomes revision 1
      description: The definition is saved even if it has problems; they're listed in the response. Publishing needs a revision without any.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflow"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRevision"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: getWorkflow
      summary: Get a workflow and its latest revision
      responses:
        "200":
          description: The workflow. Send its ETag as If-Match when saving the next revision.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRevision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    put:
      operationId: saveDraft
      summary: Save the next revision
      description: If-Match must name the latest revision, so a save can't silently undo someone else's. The definition is saved even if it has problems.
      parameters:
        - name: If-Match
          in: header
          description: The latest revision's ETag, such as "3". Without it the save is refused with 428.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workflow.yaml#/components/schemas/Definition"
      responses:
        "200":
          description: Saved.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: listRevisions
      summary: List a workflow's revisions, newest first
      responses:
        "200":
          description: Every revision, without definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/revisions/{revision}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getRevision
      summary: Get one revision, with its problems
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: publishWorkflow
      summary: Make a revision the one served
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Publish"
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/validate:
    post:
      operationId: validateDefinition
      summary: Check a definition without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workflow.yaml#/components/schemas/Definition"
      responses:
        "204":
          description: The definition has no problems.
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/workflows/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: startRun
      summary: Run a revision in the background
      description: The run goes on after this answers, for up to 5 minutes. Follow it at /v1/runs/{id}/events, or fetch it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRun"
      responses:
        "202":
          description: Started.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Busy"

  /v1/runs:
    get:
      operationId: listRuns
      summary: List runs, newest first
      parameters:
        - name: workflow_id
          in: query
          description: Only this workflow's runs.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return runs older than this id, for the next page.
          schema:
            type: string
      responses:
        "200":
          description: A page of runs, without their input, output or nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRun
      summary: Get a run, with what each node did
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: streamRunEvents
      summary: Follow a run as it happens
      description: |
        Server-sent events. Each node's progress is an event named `node`, with a NodeEvent as its data and its number in the run as its `id`. The run's end is an event named `run`, with the Run as its data and the id `end`, and the stream closes after it.

        A client that connects late, or reconnects with Last-Event-ID, gets the node events after that id, then the rest as they happen. They're kept until a minute after the run ends; after that, it gets only the `run` event. A reconnect with Last-Event-ID `end` gets 204, so an EventSource stops reconnecting. A comment line arrives every 15 s while nothing else does.
      parameters:
        - name: Last-Event-ID
          in: header
          description: The id of the last event received, a node event's number or `end`. The stream resumes after it.
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "204":
          description: The client already has the run's last event, so there's nothing more to send.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Busy"

  /serve/{slug}:
    post:
      operationId: serveWorkflow
      summary: Run a workflow's published revision and answer with its output
      description: The body is the run's input. A run that fails answers with problem details naming the node; `instance` is the run, at /v1/runs/{id}. Served runs time out after 30 s.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              description: The run's input. Absent means null.
              x-go-type: json.RawMessage
      responses:
        "200":
          description: The run's output. null when the workflow has no output expression.
          content:
            application/json:
              schema:
                x-go-type: json.RawMessage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Busy"
        "504":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The server's one API token (CONDUIT_API_TOKEN).

  parameters:
    WorkflowID:
      name: id
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: id
      in: path
      required: true
      schema:
        type: string

  headers:
    ETag:
      description: The revision, quoted, such as "3".
      schema:
        type: string

  responses:
    Problem:
      description: RFC 9457 problem details. `code` says what went wrong; `errors` lists every problem with a JSON Pointer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: Too many runs are in progress, or the server is shutting down. Try again after Retry-After seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Workflow:
      type: object
      required: [id, slug, name, latest_revision, created_at]
      properties:
        id:
          type: string
        slug:
          type: string
          description: Lowercase letters, digits and hyphens. The served endpoint is /serve/{slug}.
        name:
          type: string
        latest_revision:
          type: integer
        published_revision:
          type: integer
          description: Absent until a revision is published.
        created_at:
          type: string
          format: date-time

    WorkflowList:
      type: object
      required: [workflows]
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        next:
          type: string
          description: Pass as `before` for the next page. Absent on the last page.

    CreateWorkflow:
      type: object
      required: [slug, name, definition]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          $ref: "./workflow.yaml#/components/schemas/Definition"

    Publish:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1

    Provenance:
      type: object
      required: [actor]
      properties:
        actor:
          type: string
          description: Who saved it. In v1 always "token".
        client:
          type: string
          description: What it was saved with, from the User-Agent header.

    Revision:
      type: object
      required: [workflow_id, revision, definition, problems, provenance, created_at]
      properties:
        workflow_id:
          type: string
        revision:
          type: integer
        definition:
          $ref: "./workflow.yaml#/components/schemas/Definition"
        problems:
          type: array
          description: Everything wrong with the definition. Empty when it can be published.
          items:
            $ref: "#/components/schemas/ProblemError"
        provenance:
          $ref: "#/components/schemas/Provenance"
        created_at:
          type: string
          format: date-time

    RevisionSummary:
      type: object
      required: [revision, provenance, created_at]
      properties:
        revision:
          type: integer
        provenance:
          $ref: "#/components/schemas/Provenance"
        created_at:
          type: string
          format: date-time

    RevisionList:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/RevisionSummary"

    WorkflowRevision:
      type: object
      required: [workflow, revision]
      properties:
        workflow:
          $ref: "#/components/schemas/Workflow"
        revision:
          $ref: "#/components/schemas/Revision"

    # RFC 9457 problem details: the shape of every error response.
    Problem:
      type: object
      properties:
        type:
          type: string
          description: A URI identifying the kind of problem.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Our stable error code.
        node:
          type: string
          description: The node that failed a served run.
        errors:
          type: array
          description: Every validation problem at once.
          items:
            $ref: "#/components/schemas/ProblemError"

    ProblemError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901, plain form) into the submitted document.
        code:
          type: string
        detail:
          type: string

    StartRun:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision to run. Absent means the latest.
        input:
          description: The run's input, checked against the definition's input_schema. Absent means null.
          x-go-type: json.RawMessage

    RunSummary:
      type: object
      required: [id, workflow_id, revision, trigger, status, started_at]
      properties:
        id:
          type: string
        workflow_id:
          type: string
        revision:
          type: integer
        trigger:
          type: string
          enum: [editor, served]
          description: editor, from POST /v1/workflows/{id}/runs; served, from POST /serve/{slug}.
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        error:
          $ref: "#/components/schemas/RunError"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the run goes on.

    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required: [input]
          properties:
            input:
              description: The input, as sent.
              x-go-type: json.RawMessage
            output:
              description: The output, once the run succeeded. Over 256 KiB, its first 256 KiB as a string, and output_truncated is true.
              x-go-type: json.RawMessage
            output_truncated:
              type: boolean
            nodes:
              type: array
              description: What each node did, in the order they ended. Only from GET /v1/runs/{id}.
              items:
                $ref: "#/components/schemas/NodeRun"

    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next:
          type: string
          description: Pass as `before` for the next page. Absent on the last page.

    RunError:
      type: object
      description: Why a run or a node didn't succeed.
      required: [code, detail]
      properties:
        code:
          type: string
          enum: [upstream_failed, timeout, workflow_error, internal_error, cancelled, interrupted]
          description: |
            upstream_failed: an upstream answered with an error status, or couldn't be reached, read or allowed.
            timeout: the run, or a node's last attempt, ran out of time.
            workflow_error: the workflow's own configuration failed, such as an expression.
            internal_error: our bug; the details are in the server's log.
            cancelled: the caller hung up, or the server shut down.
            interrupted: the server stopped before the run ended.
        detail:
          type: string
        node:
          type: string
          description: On a run's error, the node that failed it.

    NodeRun:
      type: object
      required: [node, status, attempts, ended_at]
      properties:
        node:
          type: string
        status:
          type: string
          enum: [succeeded, failed, skipped, cancelled]
        attempts:
          type: integer
          description: Requests an http node sent. 0 for a node that sent none.
        request:
          $ref: "#/components/schemas/NodeRequest"
        response:
          $ref: "#/components/schemas/NodeResponse"
        error:
          $ref: "#/components/schemas/RunError"
        started_at:
          type: string
          format: date-time
          description: Absent if the node never started.
        ended_at:
          type: string
          format: date-time

    NodeRequest:
      type: object
      description: What an http node sent. Secrets aren't kept. The values of the Authorization, Proxy-Authorization, Cookie and Set-Cookie headers are [redacted], as are those of any header or query parameter whose name contains key, token, secret or password, and a password in the URL.
      required: [method, url, headers]
      properties:
        method:
          type: string
        url:
          type: string
        headers:
          type: object
          description: Lower-case names; repeated headers joined by commas.
          additionalProperties:
            type: string
        body:
          description: The JSON body. Over 256 KiB, its first 256 KiB as a string, and truncated is true.
          x-go-type: json.RawMessage
        truncated:
          type: boolean

    NodeResponse:
      type: object
      description: What an http node got back, or a transform node's value. It's the node's part of the data document, nodes.<id>, redacted and capped like NodeRequest.
      required: [body]
      properties:
        status:
          type: integer
          description: http nodes only.
        headers:
          type: object
          description: http nodes only.
          additionalProperties:
            type: string
        body:
          description: null when there was none, or it wasn't JSON.
          x-go-type: json.RawMessage
        truncated:
          type: boolean

    NodeEvent:
      type: object
      description: The data of a `node` event in a run's stream.
      required: [node, kind, attempt, at]
      properties:
        node:
          type: string
        kind:
          type: string
          enum: [started, retrying, succeeded, failed, skipped, cancelled]
        attempt:
          type: integer
          description: The attempt starting; on the event that ends the node, the attempts made.
        at:
          type: string
          format: date-time
        http_status:
          type: integer
          description: On the event that ends an http node that got an answer.
        error:
          $ref: "#/components/schemas/RunError"
