# The app's API: /api/* reaches the server with the prefix stripped, under the
# API's rate and connection limits. Include it in each location for /api/.
limit_req zone=api burst=40 nodelay;
limit_req_status 429;
limit_conn perip 20;
limit_conn_status 429;

set $server_upstream http://server:8080;
rewrite ^/api/(.*)$ /$1 break; # /api/healthz reaches the server as /healthz
proxy_pass $server_upstream;
include /etc/nginx/snippets/proxy.conf;
