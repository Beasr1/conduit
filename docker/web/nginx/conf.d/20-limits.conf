# Limits, keyed by client address. default.conf applies them per location.
#   api    new requests: 20 a second
#   perip  requests in progress at once. A rate limit counts a request once,
#          when it starts, so it can't stop one client piling up event
#          streams or slow served calls; this can.
# Behind a proxy that ends TLS, the client address is the proxy's, and every
# client would share one limit: pass the real one on first (plan 06).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
