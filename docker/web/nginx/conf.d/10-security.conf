# Content-Security-Policy by response type. Pages get the app's policy.
# Everything else (API JSON, assets) gets one that allows nothing, since none
# of it should run code or be framed. The headers that send these values are
# in snippets/security-headers.conf.
#
# A 304 gets no policy at all. It has no Content-Type, so it would get the
# one that allows nothing, and a browser copies a 304's headers onto the
# response it cached (RFC 9111, 4.3.4): a reloaded page would lose its
# scripts and come up blank. Without the header, the stored copy keeps the
# policy its 200 brought, whatever kind of response it is. The cost: a
# deploy that changes only a policy reaches a returning visitor when the
# page next changes, which any change to the app's code does. An empty value
# makes add_header send nothing.
map "$status:$sent_http_content_type" $content_security_policy {
    ~^304:          "";
    ~^\d+:text/html "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    default         "default-src 'none'; frame-ancestors 'none'";
}
