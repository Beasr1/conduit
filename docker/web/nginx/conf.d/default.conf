# The app: serves the built web app and forwards /api/* to the server. It runs
# as a non-root user on port 8080. The formats, maps and zones used here are
# defined in the numbered files beside this one, which load first.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout json;
    # nginx error lines quote the whole request line, query string included,
    # so keep secrets out of URLs. The noisiest kinds, refusals by the rate
    # and connection limits, are logged below this level; the access log
    # still records them as 429s.
    error_log /dev/stderr error;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    server_tokens off;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving per request, through the variable
    # below, finds the server again after it's recreated with a new IP; a
    # fixed proxy_pass keeps the address it resolved at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        include /etc/nginx/snippets/api.conf;
    }

    # A workflow, as created, read or saved, carries its revision's ETag,
    # which a save sends back as If-Match. Compressing a response turns its
    # ETag weak (W/"3"), and If-Match compares strongly, so it would never
    # match: these answers go uncompressed. A regex location wins over
    # /api/ above.
    location ~ ^/api/v1/workflows(/[^/]+(/draft)?)?$ {
        gzip off;
        include /etc/nginx/snippets/api.conf;
    }

    # Published workflows, for callers outside the app: /serve/{slug}
    # reaches the server unchanged, not through /api/.
    location /serve/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        limit_conn perip 20;
        limit_conn_status 429;

        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # For Docker's healthcheck; not logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output never changes, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # No dotfiles, ever.
    location ~ /\. {
        return 404;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
