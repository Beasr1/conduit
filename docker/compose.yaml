# The app on http://127.0.0.1:8088. nginx serves the web build and forwards
# /api to the server, which isn't published on the host.
name: conduit

# Rotated JSON logs, so a long-running stack can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Both containers run as non-root with no Linux capabilities, a read-only
# filesystem, and no way to gain privileges.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  server:
    <<: *hardening
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      CONDUIT_LOG_FORMAT: json
    logging: *logging

  web:
    <<: *hardening
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    tmpfs:
      - /tmp # nginx's pid file and temp files
    depends_on:
      - server
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
