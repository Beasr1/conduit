# The whole stack: the app on http://127.0.0.1:8088, behind nginx.
#
# Each service has a directory of its own with its compose file, and its
# Dockerfile when we build the image. This file only includes them. Each
# included file resolves its paths from its own directory, and together they
# make one project on one network. Settings come from .env; the justfile
# passes --env-file.
name: conduit

include:
  - postgres/compose.yaml
  - server/compose.yaml
  - web/compose.yaml
