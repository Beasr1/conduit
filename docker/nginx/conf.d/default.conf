# The app: serves the built web app and forwards /api/* to the server. It runs
# as a non-root user on port 8080. The formats, maps and zones used here are
# defined in the numbered files beside this one, which load first.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout json;
    # nginx error lines quote the whole request line, query string included,
    # so keep secrets out of URLs. The noisiest kind, rate-limit refusals, is
    # logged below this level; the access log still records them as 429s.
    error_log /dev/stderr error;
    limit_req_log_level warn;
    server_tokens off;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving per request, through the variable
    # below, finds the server again after it's recreated with a new IP; a
    # fixed proxy_pass keeps the address it resolved at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;

        set $server_upstream http://server:8080;
        rewrite ^/api/(.*)$ /$1 break; # /api/healthz reaches the server as /healthz
        proxy_pass $server_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # For Docker's healthcheck; not logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output never changes, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # No dotfiles, ever.
    location ~ /\. {
        return 404;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
