# Security headers, sent on every response, errors included ("always").
# Include this once per server block. There's no HSTS here: TLS ends in front
# of this nginx, and HSTS belongs where it ends.
add_header Content-Security-Policy $content_security_policy always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Request-ID $request_id always;

# Locations that set their own headers keep these too. Without this, one
# add_header in a location silently drops every header above.
add_header_inherit merge;
