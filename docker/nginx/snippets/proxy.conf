# Settings for every location that proxies to the server. Include it after
# proxy_pass. Like add_header, a proxy_set_header in a location replaces all
# the inherited ones, so keep every proxy header in this file.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
# Above the server's 35 s WriteTimeout, so the server's own error reaches the
# client rather than nginx's.
proxy_read_timeout 40s;
proxy_send_timeout 40s;
