# Weekly version bumps, including the digest-pinned base images. The 3-day
# cooldown matches pnpm's release-age guard: nothing brand new gets proposed.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Each of these lines is chosen on purpose and moves by hand: nginx's
      # stable branch (even minor; odd is mainline), Node's LTS line, and the
      # Go minor that server/go.mod's toolchain line names. Patch releases and
      # digest refreshes still come through.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: golang
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # The types track the Node version we run (24, web/.node-version).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
