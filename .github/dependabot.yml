# Weekly version bumps, including the digest-pinned base images. Dependabot
# holds each release back 3 days by default, so nothing brand new gets
# proposed; pnpm's own release-age guard, a day, covers installs.
version: 2
updates:
  # The Dockerfiles we build. Postgres has none; its image is in compose.
  - package-ecosystem: docker
    directories: ["/docker/server", "/docker/web"]
    schedule:
      interval: weekly
    ignore:
      # Each of these lines is chosen on purpose and moves by hand: nginx's
      # stable branch (even minor; odd is mainline), Node's LTS line, and the
      # Go minor that server/go.mod's toolchain line names. Patch releases and
      # digest refreshes still come through. nginx recommends mainline for
      # production; CI builds the images and tests nginx's config (`just
      # images`), so following it is dropping the first rule.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: golang
        update-types: ["version-update:semver-minor"]

  # Images named only in compose files: Postgres.
  - package-ecosystem: docker-compose
    directory: /docker/postgres
    schedule:
      interval: weekly
    ignore:
      # A Postgres major needs a dump and restore, so it moves by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # The types track the Node version we run (26, web/.node-version).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
